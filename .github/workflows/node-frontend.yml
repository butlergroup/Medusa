name: Frontend tests

permissions:
  contents: read

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 25.x, 26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install themes dependencies
        working-directory: ./themes-default/slim
        run: yarn install --ignore-scripts
      - name: Check themes builds
        run: |
          mv ./.github/build-themes-check.sh ./themes-default/slim
          cd ./themes-default/slim
          bash build-themes-check.sh
      - name: Test lint
        working-directory: ./themes-default/slim
        run: yarn lint && yarn lint-css
      - name: Test build
        working-directory: ./themes-default/slim
        run: yarn test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
